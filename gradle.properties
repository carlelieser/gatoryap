org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The Kotlin/Native compiler runs in its own process and does not inherit
# org.gradle.jvmargs. Release framework linking runs whole-program optimization
# and needs more heap than the default.
kotlin.native.jvmArgs=-Xmx6g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Required for Kotlin/Native (iOS) builds on Apple Silicon.
kotlin.native.ignoreDisabledTargets=true
